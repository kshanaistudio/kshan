<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/static/images/kshan_kalam_logo_gold.png">
  <link rel="apple-touch-icon" href="/static/images/kshan_kalam_logo_gold.png">
  <link rel="stylesheet" href="/static/css/style.css?v=20260902_20">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Italiana&family=Kalam:wght@700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Razorpay Standard Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  
  <!-- Global Utilities Inline (Guaranteed zero-delay availability) -->
  <script>
    function getCsrfToken() {
      const name = 'csrftoken';
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }
    function authFetch(url, options = {}) {
      options.headers = options.headers || {};
      const token = getCsrfToken();
      if (token) {
        if (options.headers instanceof Headers) {
          options.headers.set('X-CSRFToken', token);
        } else {
          options.headers['X-CSRFToken'] = token;
        }
      }
      return fetch(url, options);
    }
  </script>
  <script src="/static/js/main.js"></script>
  
  {% block extra_head %}{% endblock %}
  
</head>
<body>
  <!-- Prevent flash of wrong theme -->
  <script>
    (function() {
      var saved = localStorage.getItem('kshan-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Mobile Nav Overlay -->
  <div class="mobile-nav-overlay" id="mobileNavOverlay" onclick="closeMobileNav()"></div>

  <!-- Top Floating Glass Navbar -->
  <header class="kshan-navbar" id="kshanNavbar">
    <div style="display: flex; align-items: center; gap: 14px;">
      <a href="/" class="kshan-brand" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
        <img src="/static/images/kshan_kalam_logo_gold.png" alt="क्षण KSHAN Logo" style="height: 38px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(199,168,107,0.45));">
        <div style="display: flex; flex-direction: column;">
          <span style="font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: 0.15em; line-height: 1; color: var(--text-primary);">KSHAN</span>
          <span style="font-size: 8.5px; font-weight: 800; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; margin-top: 2px;">AI PHOTO SUITE</span>
        </div>
      </a>
    </div>
    
    <!-- Mobile Toggle -->
    <button class="kshan-mobile-toggle" onclick="toggleMobileNav()" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    
    <nav class="kshan-nav-links" id="kshanNavLinks" style="display: flex; align-items: center; gap: 20px;">
      <button class="mobile-close-btn" onclick="closeMobileNav()">&times;</button>
      
      <div style="display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); padding: 4px 6px; border-radius: var(--radius-pill); backdrop-filter: blur(12px);">
        <a href="/faceshare/" class="kshan-nav-link" style="padding: 6px 14px; border-radius: var(--radius-pill); font-size: 13px; color: var(--gold); font-weight: 700; display: inline-flex; align-items: center; gap: 6px;">
          FaceShare
          <span style="font-size: 9px; background: var(--gold); color: #111; padding: 1px 6px; border-radius: 99px; font-weight: 800;">P2P</span>
        </a>
        <a href="/#guest-access" class="kshan-nav-link" style="padding: 6px 14px; border-radius: var(--radius-pill); font-size: 13px;" onclick="focusEventSearch()">Find Event</a>
        <a href="/#how-it-works" class="kshan-nav-link" style="padding: 6px 14px; border-radius: var(--radius-pill); font-size: 13px;">How It Works</a>
        <a href="/#for-photographers" class="kshan-nav-link" style="padding: 6px 14px; border-radius: var(--radius-pill); font-size: 13px;">For Studios</a>
        <a href="/#pricing" class="kshan-nav-link" style="padding: 6px 14px; border-radius: var(--radius-pill); font-size: 13px;">Pricing</a>
      </div>

      <!-- Theme Toggle -->
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode" aria-label="Toggle theme" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      
      {% if user.is_authenticated %}
      <a href="/admin/" class="btn btn-gold btn-sm" style="display: inline-flex; align-items: center; gap: 7px; text-decoration: none; padding: 9px 18px; border-radius: 12px; font-weight: 700;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Workspace
      </a>
      <a href="/logout/" class="kshan-nav-link" style="color: var(--danger); font-size: 13px; font-weight: 600;">Sign Out</a>
      {% else %}
      <a href="/login/" class="kshan-nav-link" style="font-size: 13px; font-weight: 600;">Login</a>
      <a href="/signup/" class="btn btn-gold btn-sm" style="text-decoration: none; display: inline-flex; align-items: center; gap: 6px; padding: 9px 20px; border-radius: 12px; font-weight: 800; box-shadow: 0 4px 16px rgba(199,168,107,0.35);">
        Start Free
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
      {% endif %}
    </nav>
  </header>

  <!-- Main Content -->
  <main style="flex: 1; display: flex; flex-direction: column;">
    {% block content %}{% endblock %}
  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/js/main.js"></script>
  <script>
    /* ── Theme Toggle ── */
    function toggleTheme() {
      var html = document.documentElement;
      var current = html.getAttribute('data-theme');
      var next = current === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
      localStorage.setItem('kshan-theme', next);
    }

    function refreshIcons() {
      if (window.lucide && typeof lucide.createIcons === 'function') {
        lucide.createIcons();
      }
    }
    document.addEventListener("DOMContentLoaded", refreshIcons);
    window.addEventListener("load", refreshIcons);

    /* ── Mobile Nav ── */
    let isNavOpen = false;
    function toggleMobileNav() {
      isNavOpen = !isNavOpen;
      const nav = document.getElementById('kshanNavLinks');
      const overlay = document.getElementById('mobileNavOverlay');
      if (isNavOpen) {
        nav.classList.add('mobile-open');
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      } else {
        closeMobileNav();
      }
    }
    function closeMobileNav() {
      isNavOpen = false;
      const nav = document.getElementById('kshanNavLinks');
      const overlay = document.getElementById('mobileNavOverlay');
      nav.classList.remove('mobile-open');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    /* ── Scroll-aware navbar ── */
    let lastScroll = 0;
    const navbar = document.getElementById('kshanNavbar');
    let ticking = false;

    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          const currentScroll = window.pageYOffset;
          if (currentScroll > 60) {
            navbar.classList.add('scrolled');
          } else {
            navbar.classList.remove('scrolled');
          }
          lastScroll = currentScroll;
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true });

    /* ── Smooth reveal on scroll ── */
    const observerOptions = {
      root: null,
      rootMargin: '0px 0px -60px 0px',
      threshold: 0.1
    };

    const scrollObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.style.opacity = '1';
          entry.target.style.transform = 'translateY(0)';
          scrollObserver.unobserve(entry.target);
        }
      });
    }, observerOptions);

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-animate]').forEach(el => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(24px)';
        el.style.transition = 'opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
        scrollObserver.observe(el);
      });
    });

    /* ── Smooth focus helper for Find Event ── */
    function focusEventSearch() {
      const input = document.getElementById('eventCodeInput');
      const section = document.getElementById('guest-access');
      if (section) {
        section.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => {
          if (input) {
            input.focus();
            input.classList.add('pulse-focus');
            setTimeout(() => input.classList.remove('pulse-focus'), 1200);
          }
        }, 400);
      }
    }

    // Auto-focus if arriving with #guest-access in URL hash
    window.addEventListener('load', () => {
      if (window.location.hash === '#guest-access') {
        setTimeout(focusEventSearch, 300);
      }
    });

    /* ── Keyboard shortcut: Escape closes mobile nav ── */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isNavOpen) {
        closeMobileNav();
      }
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
